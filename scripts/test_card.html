<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720px;
    height: 1280px;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 210px;
    font-family: 'Impact', sans-serif;
  }
  .caption-container {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    padding: 12px 28px;
    border-radius: 24px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    transform: rotate(-1.5deg);
  }
  .caption-text {
    font-size: 44px;
    letter-spacing: 1.5px;
    color: #FFE600;
    -webkit-text-stroke: 7px #000000;
    paint-order: stroke fill;
    text-shadow: 0 4px 8px rgba(0,0,0,0.8);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .caption-emoji {
    width: 60px;
    height: 60px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    transform: scale(1.1);
  }
</style>
</head>
<body>
  <div class="caption-container">
    <span class="caption-text">KURTA MEIN POCKETS?!</span>
    <img class="caption-emoji" src="file:///C:/Users/User/.gemini/antigravity-ide/scratch/testimonial-collector-dashboard/scripts/emojis/mindblown.png">
  </div>
</body>
</html>
