<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="glow-purple" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-pink" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Solid Background -->
  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#glow-purple)" />
  <rect width="1200" height="630" fill="url(#glow-pink)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Brand Badge & Logo -->
  <g transform="translate(100, 100)">
    <!-- Logo Icon Box -->
    <rect width="72" height="72" rx="20" fill="#18181b" stroke="url(#badge-grad)" stroke-width="2" />
    <path d="M26 38C26 31 30 25 36 22L37.5 25C33.5 27 32 30 31.8 33H37.5V45H26V38Z" fill="url(#badge-grad)" />
    <path d="M42 38C42 31 46 25 52 22L53.5 25C49.5 27 48 30 47.8 33H53.5V45H42V38Z" fill="url(#badge-grad)" />

    <!-- Brand Name -->
    <text x="96" y="50" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">ReviewVault</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 220)">
    <rect width="480" height="42" rx="21" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
    <circle cx="28" cy="21" r="6" fill="#a78bfa" />
    <text x="46" y="27" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.02em">INSTALL ONCE • UPDATES AUTOMATICALLY</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="340" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">Collect and Display</text>
  <text x="100" y="405" fill="url(#brand-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">Customer Testimonials</text>

  <!-- Subtitle -->
  <text x="100" y="470" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400">
    Share your dedicated link, approve the best reviews, and display them on your
  </text>
  <text x="100" y="502" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400">
    website without contacting a developer for every new testimonial.
  </text>
</svg>
