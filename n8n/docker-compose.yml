version:  3.8
services:
  n8n:
    image: n8nio/n8n:1.46
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=placeholder_user
      - N8N_BASIC_AUTH_PASSWORD=placeholder_pass
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_LOG_LEVEL=info
      - NODE_ENV=production
      - TWENTY_API_KEY=placeholder_twenty_key
      - LISTMONK_API_KEY=placeholder_listmonk_key
      - POSTHOG_API_KEY=placeholder_posthog_key
      - DUB_API_KEY=placeholder_dub_key
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data
